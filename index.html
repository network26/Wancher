<meta charset="utf-8">

<title>Wancher</title>
<meta name="description" data-i18n-content="metaDesc" content="Wancher: Japanese pens and watches. Links to Wancher Pen, Wancher Watches, the 2026 catalog, and social accounts.">
<style>
  :root {
    --bg: #111111;
    --panel: #1b1b1b;
    --line: #2e2e2e;
    --text: #f4f1ec;
    --muted: #b9b2a8;
    --accent: #ee7a1e;
    --accent-2: #f6b33a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #2a1d12 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .skip { position: absolute; top: 1rem; inset-inline-start: 1rem; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip:focus { width: auto; height: auto; clip: auto; overflow: visible; background: var(--text); color: #000; padding: .5rem .75rem; border-radius: 6px; z-index: 20; }
  main {
    width: 100%;
    max-width: 760px;
    padding: clamp(2.5rem, 7vw, 5rem) 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(2rem, 5vw, 3rem);
  }
  header { width: 100%; text-align: center; }
  header img { width: min(100%, 520px); height: auto; display: block; margin: 0 auto; }
  h1.visually-hidden, .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .brands {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 5.5rem;
    padding: 1.25rem 1.5rem;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #160c03;
    font-size: clamp(1.25rem, 3.2vw, 1.5rem);
    font-weight: 700;
    letter-spacing: .04em;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(238, 122, 30, .18);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .brand:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(238, 122, 30, .28); filter: brightness(1.04); }
  .brand:focus-visible, .catalog a:focus-visible, .social a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .catalog {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem;
    text-align: center;
  }
  .catalog h2 {
    margin: 0 0 .35rem;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--accent-2);
  }
  .catalog p { margin: 0 0 1.1rem; color: var(--muted); }
  .catalog a {
    display: inline-block;
    padding: .8rem 1.4rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: background .15s ease, color .15s ease;
  }
  .catalog a:hover { background: var(--accent); color: #160c03; }
  .social { width: 100%; text-align: center; }
  .social h2 { margin: 0 0 1rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
  .social ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    padding: .7rem 1.2rem;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: border-color .15s ease, background .15s ease;
  }
  .social a:hover { border-color: var(--accent); background: #231a12; }
  .social svg { width: 1.15rem; height: 1.15rem; fill: currentColor; flex: none; }
  .contact { width: 100%; text-align: center; }
  .contact a {
    display: inline-block;
    padding: .9rem 2rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--text);
    font-weight: 700;
    letter-spacing: .04em;
    text-decoration: none;
    transition: background .15s ease, color .15s ease;
  }
  .contact a:hover { background: var(--accent); color: #160c03; }
  .contact a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  footer { margin-top: auto; padding: 1.5rem 1rem 2rem; color: #7d776f; font-size: .85rem; text-align: center; }
  .lang {
    position: absolute;
    top: .75rem;
    inset-inline-end: .75rem;
    z-index: 10;
  }
  .lang select {
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
    background-color: rgba(27, 27, 27, .9);
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 1rem center, right .7rem center;
    background-size: .3rem .3rem, .3rem .3rem;
    background-repeat: no-repeat;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .45rem 1.9rem .45rem .9rem;
    max-width: 12rem;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  [dir="rtl"] .lang select { background-position: left .7rem center, left 1rem center; padding: .45rem .9rem .45rem 1.9rem; }
  .lang select:hover { border-color: var(--accent); }
  .lang select:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .lang option, .lang optgroup { background: var(--panel); color: var(--text); }
  /* Google Website Translator: keep its UI hidden and stop it pushing the page down */
  #google_translate_element, .goog-te-banner-frame, iframe.skiptranslate, .skiptranslate > iframe,
  .goog-te-balloon-frame, #goog-gt-tt, .goog-tooltip, .VIpgJd-ZVi9od-ORHb-OEVmcd, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; visibility: hidden !important; }
  html, body { top: 0 !important; position: static !important; }
  html[class*="translated-"] main span.notranslate, html[class*="translated-"] footer span.notranslate { margin-inline: .25em; }
  html[class*="translated-"] .social a > span.notranslate { margin-inline: 0; }
  .goog-text-highlight { background: none !important; box-shadow: none !important; }
  main { padding-top: max(clamp(2.5rem, 7vw, 5rem), 4rem); }
  [dir="rtl"] .catalog h2, [dir="rtl"] .social h2, [dir="rtl"] .brand, [dir="rtl"] .contact a { letter-spacing: 0; }
  :lang(ja) .catalog h2, :lang(ja) .social h2, :lang(ko) .catalog h2, :lang(ko) .social h2 { letter-spacing: .12em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
