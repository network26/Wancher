<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wancher</title>
<meta name="description" content="Wancher: Japanese pens and watches. Links to Wancher Pen, Wancher Watches, the 2026 catalog, and social accounts.">
<style>
  :root {
    --bg: #111111;
    --panel: #1b1b1b;
    --line: #2e2e2e;
    --text: #f4f1ec;
    --muted: #b9b2a8;
    --accent: #ee7a1e;
    --accent-2: #f6b33a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #2a1d12 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 1rem; top: 1rem; background: var(--text); color: #000; padding: .5rem .75rem; border-radius: 6px; }
  main {
    width: 100%;
    max-width: 760px;
    padding: clamp(2.5rem, 7vw, 5rem) 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(2rem, 5vw, 3rem);
  }
  header { width: 100%; text-align: center; }
  header img { width: min(100%, 520px); height: auto; display: block; margin: 0 auto; }
  h1.visually-hidden, .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .brands {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 5.5rem;
    padding: 1.25rem 1.5rem;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #160c03;
    font-size: clamp(1.25rem, 3.2vw, 1.5rem);
    font-weight: 700;
    letter-spacing: .04em;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(238, 122, 30, .18);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .brand:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(238, 122, 30, .28); filter: brightness(1.04); }
  .brand:focus-visible, .catalog a:focus-visible, .social a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .catalog {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem;
    text-align: center;
  }
  .catalog h2 {
    margin: 0 0 .35rem;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--accent-2);
  }
  .catalog p { margin: 0 0 1.1rem; color: var(--muted); }
  .catalog a {
    display: inline-block;
    padding: .8rem 1.4rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: background .15s ease, color .15s ease;
  }
  .catalog a:hover { background: var(--accent); color: #160c03; }
  .social { width: 100%; text-align: center; }
  .social h2 { margin: 0 0 1rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
  .social ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
  .social a {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    padding: .7rem 1.2rem;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: border-color .15s ease, background .15s ease;
  }
  .social a:hover { border-color: var(--accent); background: #231a12; }
  .social svg { width: 1.15rem; height: 1.15rem; fill: currentColor; flex: none; }
  .contact { width: 100%; text-align: center; }
  .contact a {
    display: inline-block;
    padding: .9rem 2rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--text);
    font-weight: 700;
    letter-spacing: .04em;
    text-decoration: none;
    transition: background .15s ease, color .15s ease;
  }
  .contact a:hover { background: var(--accent); color: #160c03; }
  .contact a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  footer { margin-top: auto; padding: 1.5rem 1rem 2rem; color: #7d776f; font-size: .85rem; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
